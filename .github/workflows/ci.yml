name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        description: Include the live customer Cascade native acceptance
        default: false
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  native-acceptance:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.CUSTOMER_NATIVE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install lockfile-pinned OpenCode hosts with npm integrity enforcement
        run: npm ci
      - name: Native acceptance on pinned OpenCode 2
        env:
          NATIVE_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/native-acceptance/receipt.json
        run: npm run acceptance:native
      - name: Native acceptance on pinned OpenCode 1
        env:
          NATIVE_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/native-acceptance/receipt-opencode-1.json
        run: npm run acceptance:native -- --generation 1
      - name: Native acceptance against customer Cascade
        if: inputs.live == true || vars.CUSTOMER_NATIVE_ENABLED == 'true'
        env:
          NATIVE_ACCEPTANCE_RECEIPT: ${{ runner.temp }}/native-acceptance/live-receipt.json
          CUSTOMER_NATIVE_CLASSIFIER: live
          CUSTOMER_NATIVE_API_URL: ${{ vars.CUSTOMER_API_URL }}
          CUSTOMER_NATIVE_API_KEY: ${{ secrets.CUSTOMER_API_KEY }}
        run: npm run acceptance:native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-acceptance
          path: ${{ runner.temp }}/native-acceptance/
          retention-days: 7
